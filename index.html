<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyProdigy</title>
  <link rel="stylesheet" href="style.css" />
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_Y2FwYWJsZS1zbG90aC01LmNsZXJrLmFjY291bnRzLmRldiQ" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>PyProdigy</h1>
        <p class="subtitle">Level up your Python skills</p>
      </div>
      <div class="topbar">
        <div class="coin-box">🪙 <span id="coinCount">0</span></div>
        <div id="auth"></div>
      </div>
    </header>

    <main>
      <section class="problem-card">
        <div class="problem-top">
          <span id="difficultyBadge">Beginner</span>
          <span id="categoryBadge">Arrays</span>
        </div>

        <h2 id="problemTitle"></h2>
        <p id="problemDescription"></p>

        <div class="example-box">
          <h3>Example</h3>
          <pre id="problemExample"></pre>
        </div>
      </section>

      <section class="editor-card">
        <textarea id="editor"></textarea>

        <div class="actions">
          <button id="runBtn">Run</button>
          <button id="checkBtn">Check</button>
          <button id="hintBtn">Hint</button>
        </div>

        <div id="output"></div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
